name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run db:validate
        env:
          DATABASE_URL: postgresql://orionx:local@localhost:5432/orionx
          DIRECT_URL: postgresql://orionx:local@localhost:5432/orionx
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build -w @orionx/web
      - run: npm test
      - run: docker build -f Dockerfile.worker -t orionx-worker .
