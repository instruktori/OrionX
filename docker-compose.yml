services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orionx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orionx_local_only}
      POSTGRES_DB: orionx
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U orionx"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
